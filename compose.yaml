services:
  deptrac:
    build:
      dockerfile: docker/php/Dockerfile
      context: ./
    container_name: deptrac
    tty: true
    environment:
      - PHP_IDE_CONFIG=serverName=deptrac
      - COMPOSER_CACHE_DIR=/var/www/deptrac/.cache/composer
    userns_mode: keep-id
    volumes:
      - ./:/var/www/deptrac
      - composer-data:/var/www/deptrac/cache/composer
    extra_hosts:
      - host.docker.internal:${HOST_IP:-host-gateway}

volumes:
  composer-data:
